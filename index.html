<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CTET Mock Test 2026 — Set 1 | Central Scoreboard</title>
<style>
:root{--bg:#000;--panel:#0b0b0b;--panel2:#111;--line:#242424;--text:#f4f4f4;--muted:#a5a5a5;--green:#16d96b;--red:#ff3152;--accent:#5c8dff;--gold:#ffd45a}
body.light{--bg:#f5f7fb;--panel:#fff;--panel2:#f0f2f6;--line:#d8dce5;--text:#151922;--muted:#626a78;--accent:#315fce;--gold:#9a6500}
body.light,body.light html{background:#f5f7fb;color:#151922}
body.light .card,body.light .qcard,body.light .result-card,body.light .admin-card{background:#fff;border-color:#d8dce5;box-shadow:0 18px 50px rgba(0,0,0,.08)}
body.light .top{background:rgba(255,255,255,.94)}
body.light .timer,body.light .name,body.light .omr,body.light .review-row,body.light .stat,body.light .p{background:#f8f9fc;color:#151922;border-color:#d8dce5}
body.light .bubble{background:#fff;color:#151922;border-color:#7d8491}
body.light .bubble.selected{background:#151922;color:#fff;border-color:#151922}
body.light .opt{background:#f8f9fc;color:#151922;border-color:#d8dce5}
body.light .admin-tools button,body.light .result-actions button{background:#fff;color:#151922;border-color:#c4c9d3}
body.light .primary,body.light .next{background:#151922;color:#fff}
.themeBtn,.adminTopBtn{border:1px solid #555;background:#111;color:#fff;border-radius:10px;padding:9px 11px;font-weight:900}
body.light .themeBtn,body.light .adminTopBtn{background:#fff;color:#151922;border-color:#c4c9d3}
.topcontrols{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adminTopBtn{background:#ffd45a;color:#000;border-color:#ffd45a}
.omr.single{margin-top:18px;padding:12px 14px}
.omr.single .omrtitle{margin-bottom:8px}
.omr.single .bubbles{flex-wrap:nowrap;gap:9px;justify-content:center}
.omr.single .bubble{width:48px;height:42px;padding:0}
.omr-note{font-size:11px;color:var(--muted);text-align:center;margin-top:7px}
.result-omr-compare{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.omr-sheet{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel2)}
.omr-sheet h3{font-size:14px;margin-bottom:12px}
.omr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.omr-cell{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12px}
.omr-cell .mini{width:24px;height:24px;border:2px solid #777;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:10px}
.omr-cell.marked .mini{background:#151922;color:#fff;border-color:#151922}
.omr-cell.correct .mini{background:var(--green);color:#001b09;border-color:var(--green)}
.omr-cell.wrong .mini{background:var(--red);color:#fff;border-color:var(--red)}
.omr-cell.unanswered .mini{opacity:.45}
.compare-legend{font-size:11px;color:var(--muted);margin-top:9px}
@media(max-width:700px){.result-omr-compare{grid-template-columns:1fr}.omr-grid{grid-template-columns:repeat(2,1fr)}.topin{align-items:center}.topcontrols{justify-content:flex-end}.adminTopBtn,.themeBtn{font-size:11px;padding:8px}.omr.single .bubble{width:45px}}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(620px,100%);background:linear-gradient(180deg,#101010,#080808);border:1px solid #292929;border-radius:24px;box-shadow:0 24px 80px #000;padding:30px}
h1,h2,h3{margin:0}.brand{text-align:center;font-weight:900;letter-spacing:.14em}.sub{color:var(--muted);text-align:center;margin-top:8px}
label{display:block;margin:28px 0 9px;font-weight:700}.name{width:100%;padding:16px;border-radius:14px;border:1px solid #343434;background:#050505;color:#fff;outline:none}.name:focus{border-color:var(--accent)}
.primary{width:100%;border:0;border-radius:14px;padding:16px 20px;background:#fff;color:#000;font-weight:900;margin-top:12px}
.hidden{display:none!important}
.exam{min-height:100vh;padding-bottom:30px}.top{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}
.topin{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.testname{font-weight:900;font-size:14px}.timer{font-variant-numeric:tabular-nums;font-weight:1000;font-size:22px;border:1px solid #383838;border-radius:12px;padding:8px 12px;background:#0c0c0c}.timer.warn{color:#ffb13b;border-color:#8a5b12}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px}.progress{color:var(--muted);font-size:13px;margin-bottom:12px}.qcard{background:#0b0b0b;border:1px solid var(--line);border-radius:20px;padding:20px}.qnum{color:var(--gold);font-weight:900;margin-bottom:12px}.question{font-size:20px;line-height:1.5;font-weight:750;white-space:pre-wrap}.options{display:grid;gap:10px;margin-top:20px}.opt{width:100%;text-align:left;border:1px solid #303030;background:#070707;color:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;transition:.15s}.opt:hover{border-color:#666}.opt.selected{border-color:var(--accent);background:#101a33}.opt.correct{border-color:var(--green);background:#092313}.opt.wrong{border-color:var(--red);background:#2a080f}.letter{font-weight:900;min-width:26px}.omr{margin-top:20px;border:1px solid #252525;border-radius:16px;padding:14px;background:#050505}.omrtitle{font-size:11px;letter-spacing:.12em;color:#aaa;font-weight:900;margin-bottom:10px}.bubbles{display:flex;gap:10px;flex-wrap:wrap}.bubble{width:54px;height:40px;border-radius:999px;border:1px solid #404040;background:#0b0b0b;color:#fff;font-weight:900}.bubble.selected{background:#fff;color:#000;border-color:#fff}.bubble.correct{background:var(--green);color:#001b09;border-color:var(--green)}.bubble.wrong{background:var(--red);border-color:var(--red);color:#fff}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.next,.submit{border:0;border-radius:13px;padding:13px 18px;font-weight:900}.next{background:#fff;color:#000;margin-left:auto}.next:disabled{opacity:.35;cursor:not-allowed}.submit{background:#ffd45a;color:#000}
.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.p{width:32px;height:32px;border:1px solid #333;border-radius:9px;background:#080808;color:#aaa;font-size:12px}.p.done{background:#163c24;color:#8cffb9;border-color:#236f3d}.p.current{outline:2px solid #fff}
.result{min-height:100vh;padding:22px}.result-card{max-width:1050px;margin:auto;background:#0b0b0b;border:1px solid #292929;border-radius:24px;padding:24px}.result-title{text-align:center;font-weight:1000;letter-spacing:.08em}.candidate{text-align:center;color:#bbb;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.stat{border:1px solid #292929;border-radius:15px;padding:15px;background:#060606}.stat small{display:block;color:#999}.stat strong{display:block;font-size:24px;margin-top:4px}.review{margin-top:22px;display:grid;gap:10px}.review-row{border:1px solid #292929;border-radius:14px;padding:14px;background:#070707}.review-q{font-weight:800}.review-a{margin-top:7px;color:#bbb}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.tag.ok{background:#123e23;color:#6dffa5}.tag.bad{background:#450c17;color:#ff879a}.tag.skip{background:#2c2c2c;color:#bbb}.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.result-actions button{border:1px solid #444;background:#111;color:#fff;border-radius:12px;padding:12px 15px;font-weight:800}
.admin{min-height:100vh;padding:20px}.admin-card{max-width:1200px;margin:auto;background:#0b0b0b;border:1px solid #292929;border-radius:22px;padding:20px}.adminbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.admin-tools{display:flex;gap:8px;flex-wrap:wrap}.admin-tools button{border:1px solid #444;background:#111;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800}.danger{border-color:#8c2033!important;color:#ff91a1!important}.tablewrap{overflow:auto;margin-top:16px}.tbl{width:100%;border-collapse:collapse;min-width:900px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid #242424;text-align:left;white-space:nowrap}.tbl th{color:#aaa;font-size:12px}.empty{color:#888;padding:25px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:999}
@media(max-width:700px){.card{padding:24px}.question{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.topin{align-items:flex-start}.timer{font-size:19px}.bubble{width:50px}}

.result-omr-compare{display:block}
.result-omr-compare .omr-sheet{margin-top:18px}
.result-omr-review{display:grid;gap:8px}
.result-omr-row{display:grid;grid-template-columns:52px repeat(4,minmax(46px,1fr)) 46px 38px;gap:7px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:7px;background:var(--panel)}
.result-omr-row .rq{font-weight:900;font-size:12px}
.result-omr-row .rb{height:38px;border:2px solid #666;border-radius:50%;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.result-omr-row .rb.candidate{background:#151922;color:#fff;border-color:#151922}
.result-omr-row .rb.official{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);color:var(--green)}
.result-omr-row .rb.candidate.official{background:var(--green);color:#001b09;border-color:var(--green);box-shadow:none}
.result-omr-row .status{font-size:11px;font-weight:1000;text-align:center;line-height:1}
.result-omr-row .status.ok{color:var(--green)}
.result-omr-row .status.bad{color:var(--red);font-size:25px}
.result-omr-row .status.skip{color:#999;font-size:18px}
.omr-legend2{font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:700px){
 .result-omr-row{grid-template-columns:42px repeat(4,minmax(40px,1fr)) 40px 30px;gap:5px;padding:6px}
 .result-omr-row .rb{height:34px;font-size:12px}
 .result-omr-row .rq{font-size:11px}
 .result-omr-row .status.bad{font-size:21px}
}
@media print{body{background:#fff;color:#000}.result-card{border:0}.result-actions{display:none}.review-row{break-inside:avoid}.result{padding:0}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="start" class="screen">
 <div class="card">
  <h1 class="brand">MOCK TEST</h1>
  <label for="candidate">Candidate Name</label>
  <input id="candidate" class="name" autocomplete="name">
  <button id="startBtn" class="primary">EXAM START</button>
 </div>
</section>

<section id="exam" class="exam hidden">
 <header class="top"><div class="topin">
<div class="testname">CTET MOCK TEST — 2026 · SET 1</div>
<div class="topcontrols">
<button id="themeBtn" class="themeBtn" type="button">☀️ THEME</button>
<button id="adminTopBtn" class="adminTopBtn" type="button">🔐 ADMIN PORTAL</button>
<div id="timer" class="timer">60:00</div>
</div></div></header>
 <main class="wrap">
  <div id="progress" class="progress"></div>

  <div id="palette" class="palette"></div>
 </main>
</section>

<section id="admin" class="admin hidden">
 <div class="admin-card">
  <div class="adminbar">
   <div><h2>ADMIN PORTAL</h2><div class="sub" style="text-align:left">Saved results in this browser</div></div>
   <div class="admin-tools">
    <button id="refreshAdmin">REFRESH RESULTS</button>
    <button id="csvAdmin">DOWNLOAD RESULTS CSV</button>
    <button id="printAdmin">PRINT / SAVE PDF REPORT</button>
    <button id="clearAdmin" class="danger">CLEAR ALL RESULTS</button>
   </div>
  </div>

 </div>
</section>

<script>
const QUESTIONS = [{"id": 1, "text": "An increase of 5 cm in a child's height over one year is an example of:", "options": ["Development", "Growth", "Maturation only", "Learning"], "answer": "B"}, {"id": 2, "text": "Development proceeds from the head region towards the lower parts of the body. This is known as the:", "options": ["Cephalocaudal principle", "Principle of integration", "Principle of readiness", "Proximodistal principle"], "answer": "A"}, {"id": 3, "text": "A child fails to understand that the quantity of clay remains the same when its shape is changed. According to Piaget, this child is most likely in the:", "options": ["Concrete operational stage", "Formal operational stage", "Sensorimotor stage", "Preoperational stage"], "answer": "D"}, {"id": 4, "text": "The gap between what a child can achieve independently and what the child can achieve with the help of a more capable person is termed by Vygotsky as:", "options": ["Assimilation", "Scaffolding", "Zone of Proximal Development", "Equilibration"], "answer": "C"}, {"id": 5, "text": "A student obeys the classroom rules only because he fears being punished by the teacher. According to Kohlberg, this reflects:", "options": ["Post-conventional morality", "Conventional morality", "Pre-conventional morality", "Universal ethical reasoning"], "answer": "C"}, {"id": 6, "text": "According to Erikson, a primary-school-age child who repeatedly fails at tasks and is harshly criticised may develop a sense of:", "options": ["Shame and doubt", "Inferiority", "Role confusion", "Mistrust"], "answer": "B"}, {"id": 7, "text": "A student who shows an outstanding ability to understand and manage his own emotions, but is average in mathematics, demonstrates strength in which of Gardner's intelligences?", "options": ["Intrapersonal", "Naturalistic", "Logical-Mathematical", "Interpersonal"], "answer": "A"}, {"id": 8, "text": "A 9-year-old child (chronological age) performs at the mental level of an 11-year-old. The child's approximate IQ is:", "options": ["90", "82", "100", "122"], "answer": "D"}, {"id": 9, "text": "In an inclusive classroom, the school curriculum and teaching methods are modified to meet the needs of the child. This reflects:", "options": ["Special education", "Integrated education", "Inclusive education", "Segregated education"], "answer": "C"}, {"id": 10, "text": "A specific learning disability that primarily affects a child's reading ability, despite average intelligence, is called:", "options": ["Dysgraphia", "Dyslexia", "Aphasia", "Dyscalculia"], "answer": "B"}, {"id": 11, "text": "The \"Comprehensive\" dimension of Continuous and Comprehensive Evaluation (CCE) refers to the evaluation of:", "options": ["Only co-curricular activities", "Only a single annual examination", "Only academic subjects", "Both scholastic and co-scholastic areas"], "answer": "D"}, {"id": 12, "text": "Assessment conducted during the teaching-learning process to provide ongoing feedback for improvement is called:", "options": ["Norm-referenced assessment", "Summative assessment", "Diagnostic assessment", "Formative assessment"], "answer": "D"}, {"id": 13, "text": "Learning is best defined as a change in behaviour that is:", "options": ["Temporary and caused by fatigue", "Relatively permanent and results from experience", "Caused only by physical maturation", "Always identical to growth"], "answer": "B"}, {"id": 14, "text": "A teacher stops scolding a student the moment the student begins doing homework, and the student's homework habit improves. This is an example of:", "options": ["Negative reinforcement", "Positive punishment", "Negative punishment", "Positive reinforcement"], "answer": "A"}, {"id": 15, "text": "Piaget viewed a young child's habit of talking aloud while playing alone as a sign of:", "options": ["Language disorder", "Gender bias", "A valuable self-guidance tool", "Egocentrism, which fades with maturity"], "answer": "D"}, {"id": 16, "text": "According to Vygotsky, a child's habit of talking aloud while solving a problem eventually becomes internalised as:", "options": ["An overgeneralisation error", "Egocentric speech", "Inner speech", "A learning disability"], "answer": "C"}, {"id": 17, "text": "A teacher believes that \"girls are naturally better at languages than boys.\" This belief is an example of a:", "options": ["Gender role", "Gender identity", "Gender stereotype", "Gender-sensitive practice"], "answer": "C"}, {"id": 18, "text": "Which agent of socialisation becomes increasingly influential during late childhood and adolescence?", "options": ["Peer group", "Media alone", "School administration alone", "Family"], "answer": "A"}, {"id": 19, "text": "According to Goleman, the ability to recognise and manage one's own emotional responses is called:", "options": ["Social Skills", "Motivation", "Empathy", "Self-Regulation"], "answer": "D"}, {"id": 20, "text": "A teacher unconsciously gives more attention and challenging questions to students she believes are \"bright,\" and these students go on to perform better. This phenomenon is known as:", "options": ["Positive transfer", "Formative assessment", "The Pygmalion Effect", "Scaffolding"], "answer": "C"}, {"id": 21, "text": "In a child-centred classroom, the teacher's primary role is that of a:", "options": ["Sole transmitter of information", "Facilitator who guides learning", "Strict disciplinarian only", "Passive observer with no role"], "answer": "B"}, {"id": 22, "text": "Jerome Bruner's approach in which students explore materials and arrive at concepts on their own, with the teacher guiding rather than telling, is called:", "options": ["Rote Learning", "Deductive Teaching", "Classical Conditioning", "Discovery Learning"], "answer": "D"}, {"id": 23, "text": "Providing temporary support to a learner, which is gradually withdrawn as competence increases, is called:", "options": ["Accommodation", "Equilibration", "Assimilation", "Scaffolding"], "answer": "D"}, {"id": 24, "text": "A child with a borderline IQ (around 75-85) who learns slowly across most subjects but does not meet the criteria for intellectual disability is best described as a:", "options": ["Child with aphasia", "Gifted child", "Slow learner", "Child with dyscalculia"], "answer": "C"}, {"id": 25, "text": "According to Erikson, the psychosocial crisis of infancy (birth to about 18 months) is:", "options": ["Autonomy vs Shame and Doubt", "Trust vs Mistrust", "Initiative vs Guilt", "Industry vs Inferiority"], "answer": "B"}, {"id": 26, "text": "A student who studies purely to earn a reward promised by a parent is displaying:", "options": ["Extrinsic motivation", "Self-actualisation", "Cognitive dissonance", "Intrinsic motivation"], "answer": "A"}, {"id": 27, "text": "According to Miller, the capacity of short-term memory is approximately:", "options": ["20 ± 5 items", "Unlimited", "2 ± 1 items", "7 ± 2 items"], "answer": "D"}, {"id": 28, "text": "The Ebbinghaus Forgetting Curve shows that the rate of forgetting is:", "options": ["Unrelated to the passage of time", "Constant throughout the retention period", "Steepest immediately after learning and then gradually levels off", "Fastest several months after learning"], "answer": "C"}, {"id": 29, "text": "NEP 2020 restructures school education into which stage-wise pattern?", "options": ["10 + 2", "5 + 3 + 3 + 4", "8 + 4", "6 + 6"], "answer": "B"}, {"id": 30, "text": "When a teacher allows students to briefly discuss a difficult concept in their home language before answering in the language of instruction, she is treating multilingualism as a:", "options": ["Classroom resource", "Sign of a learning disability", "Reason for lower expectations", "Problem to be eliminated"], "answer": "A"}, {"id": 46, "text": "Which of the following is a RECEPTIVE and ORAL language skill?", "options": ["Speaking", "Listening", "Writing", "Reading"], "answer": "B"}, {"id": 47, "text": "According to Krashen, subconscious, natural language development similar to how a first language is learned is called:", "options": ["Language Acquisition", "Language Teaching", "Grammar Translation", "Language Learning"], "answer": "A"}, {"id": 48, "text": "Reading a passage quickly to get its general idea is called:", "options": ["Intensive reading", "Proof-reading", "Scanning", "Skimming"], "answer": "D"}, {"id": 49, "text": "Reading a timetable quickly to find one specific departure time is an example of:", "options": ["Reading aloud", "Skimming", "Scanning", "Silent reading for pleasure"], "answer": "C"}, {"id": 50, "text": "A child says \"I goed to school\" instead of \"I went to school.\" This is an example of:", "options": ["A random careless mistake", "Overgeneralisation, showing the child has grasped a grammar rule", "A speech disorder", "Aphasia"], "answer": "B"}, {"id": 51, "text": "An error that reflects a genuine, consistent gap in a learner's language competence is called a(n):", "options": ["Error", "Interlingual transfer only", "Fair test", "Mistake"], "answer": "A"}, {"id": 52, "text": "A Hindi-speaking learner of English says \"I am knowing the answer,\" reflecting a structure common in the learner's first language. This is an example of a(n):", "options": ["Random mistake", "Articulation disorder", "Intralingual error", "Interlingual error"], "answer": "D"}, {"id": 53, "text": "Which approach to language teaching prioritises meaningful, genuine communication over strict grammatical accuracy?", "options": ["Deductive drilling only", "Grammar-Translation Method", "Communicative Language Teaching", "Rote memorisation"], "answer": "C"}, {"id": 54, "text": "A teacher presents several example sentences and lets students discover the grammar rule themselves. This reflects the:", "options": ["Deductive approach", "Inductive approach", "Translation method", "Confirmation approach"], "answer": "B"}, {"id": 55, "text": "A reading approach that begins with decoding letters and sounds is called the:", "options": ["Phonics/Bottom-up approach", "Communicative approach", "Process approach", "Whole Language/Top-down approach"], "answer": "A"}, {"id": 56, "text": "The stage of the writing process in which a student produces an initial version of a piece of writing is called:", "options": ["Publishing", "Pre-writing/Planning", "Editing", "Drafting"], "answer": "D"}, {"id": 57, "text": "A speech fluency disorder involving involuntary repetitions, prolongations, or blocks in speech is called:", "options": ["An articulation disorder only", "Aphasia", "Stammering", "Dyslexia"], "answer": "C"}, {"id": 58, "text": "Allowing a multilingual student to draw on both their home language and English to make meaning in class is called:", "options": ["Suppression", "Translanguaging", "Grammar-Translation Method", "Rote learning"], "answer": "B"}, {"id": 59, "text": "Remedial teaching in language classes should ideally begin with:", "options": ["Diagnostic assessment to identify the specific difficulty", "Ignoring the learner's specific need", "Punishing the learner for the error", "Repeating the same failed lesson at the same pace"], "answer": "A"}, {"id": 60, "text": "When teaching a poem to young learners, which of the following should generally come FIRST?", "options": ["A written examination on the poem", "Silent analytical reading only, with no vocalisation", "Detailed grammatical analysis of every line", "Reading the poem aloud and enjoying its sound and rhythm"], "answer": "D"}, {"id": 61, "text": "The place value of 7 in the number 47,296 is:", "options": ["7", "70", "7,000", "700"], "answer": "C"}, {"id": 62, "text": "What is the sum of 3,847 and 2,956?", "options": ["6,803", "6,793", "6,893", "6,703"], "answer": "A"}, {"id": 63, "text": "What is the product of 34 and 12?", "options": ["418", "384", "396", "408"], "answer": "D"}, {"id": 64, "text": "Divide 144 by 12. The quotient is:", "options": ["13", "10", "11", "12"], "answer": "D"}, {"id": 65, "text": "Which of the following fractions is equival const DURATION = 60*60;
const ADMIN_PASSWORD = "Bikash@420";
const RESULTS_KEY = "ctet_mock_2026_set1_results_v1";

/* CENTRAL SCOREBOARD CONNECTION — already configured for you */
const CENTRAL_SCOREBOARD_URL = "https://script.google.com/macros/s/AKfycbytueCrNAG0lJv3EnzQFeziSNuDepsWoxgxHOfUMLLQWxm5b5dur3xWMCEaj2ID7VNbEA/exec";
const CENTRAL_API_TOKEN = "CTET_SCOREBOARD_2026_BIKAS_420";
const TEST_ID = "MOCK-01";

let candidate="", idx=0, answers={}, startAt=0, timerHandle=null, submitted=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const letter=i=>String.fromCharCode(65+i);

function getResults(){try{return JSON.parse(localStorage.getItem(RESULTS_KEY)||"[]")}catch(e){return[]}}
function saveResults(a){localStorage.setItem(RESULTS_KEY,JSON.stringify(a))}

/*
 * Sends the completed result to the Google Apps Script Central Scoreboard.
 * The request intentionally uses text/plain + no-cors so a GitHub-hosted
 * HTML page can submit without a browser CORS preflight. The same submission
 * ID is used by the server to prevent duplicate rows.
 */
function submitToCentralScoreboard(r){
  try{
    const payload={
      token:CENTRAL_API_TOKEN,
      testId:TEST_ID,
      candidate:r.candidate,
      score:r.score,
      percentage:r.percentage,
      timeUsed:r.timeUsed,
      submissionId:r.id
    };
    return fetch(CENTRAL_SCOREBOARD_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body:JSON.stringify(payload),
      keepalive:true
    }).then(()=>{
      const el=$("centralStatus");
      if(el)el.textContent="CENTRAL SCOREBOARD: RESULT SENT";
    }).catch(()=>{
      const el=$("centralStatus");
      if(el)el.textContent="CENTRAL SCOREBOARD: CONNECTION FAILED";
    });
  }catch(e){
    const el=$("centralStatus");
    if(el)el.textContent="CENTRAL SCOREBOARD: CONNECTION FAILED";
    return Promise.resolve();
  }
}

function beep(correct){
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const c=new C(), now=c.currentTime;
 const tones=correct?[523.25,659.25,783.99,1046.5]:[220,174.61,138.59,110];
 tones.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=correct?"sine":"square";o.frequency.value=f;g.gain.setValueAtTime(.001,now+i*.075);g.gain.exponentialRampToValueAtTime(.9,now+i*.075+.015);g.gain.exponentialRampToValueAtTime(.001,now+i*.075+.23);o.connect(g);g.connect(c.destination);o.start(now+i*.075);o.stop(now+i*.075+.25)});
 setTimeout(()=>c.close(),900);
}
function fireworks(good){
 const canvas=$("fx"),ctx=canvas.getContext("2d");canvas.width=innerWidth;canvas.height=innerHeight;
 const bursts=[];
 for(let b=0;b<10;b++){bursts.push({x:innerWidth*(.08+.84*Math.random()),y:innerHeight*(.18+.64*Math.random()),t:0,parts:Array.from({length:70},(_,i)=>{let a=Math.PI*2*i/70+Math.random()*.08;let s=2+Math.random()*5;return{x:0,y:0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*35}})})}
 let f=0;
 function frame(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=good?"#16d96b":"#ff3152";bursts.forEach(b=>b.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life--;if(p.life>0){ctx.globalAlpha=Math.max(0,p.life/65);ctx.beginPath();ctx.arc(b.x+p.x,b.y+p.y,2.2,0,Math.PI*2);ctx.fill()}}));ctx.globalAlpha=1;if(++f<85)requestAnimationFrame(frame);else ctx.clearRect(0,0,canvas.width,canvas.height)}
 frame();
}
function formatTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}

function render(){
  const q=QUESTIONS[idx], a=answers[q.id];
  $("progress").textContent=`Question ${idx+1} of ${QUESTIONS.length}`;
  $("qcard").innerHTML=`
   <div class="qnum">Q${String(q.id).padStart(2,"0")}</div>
   <div class="question">${esc(q.text)}</div>
   <div class="options">${q.options.map((o,i)=>{
     const L=letter(i);
     return `<div class="opt"><span class="letter">${L}.</span><span>${esc(o)}</span></div>`}).join("")}</div>
   <div class="omr single"><div class="omrtitle">ANSWER OMR — MARK YOUR ANSWER BELOW</div><div class="bubbles">
    ${q.options.map((o,i)=>{const L=letter(i);let c=a===L?"selected":"";return `<button type="button" class="bubble ${c}" data-bubble="${L}">${L}</button>`}).join("")}
   </div><div class="omr-note">Only the OMR bubble is clickable. Selecting an option above does not answer the question.</div></div>
   <div class="actions">
    ${idx===QUESTIONS.length-1?`<button id="submitBtn" class="submit">SUBMIT EXAM</button>`:""}
    <button id="nextBtn" class="next" ${a?"":"disabled"}>${idx===QUESTIONS.length-1?"FINISH":"NEXT"}</button>
   </div>`;
  $("qcard").querySelectorAll("[data-bubble]").forEach(el=>el.onclick=()=>choose(el.dataset.bubble));
  $("nextBtn").onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else submitExam()};
  const sb=$("submitBtn");if(sb)sb.onclick=submitExam;
  renderPalette();
}
function renderPalette(){$("palette").innerHTML=QUESTIONS.map((q,i)=>`<button class="p ${answers[q.id]?"done":""} ${i===idx?"current":""}" data-i="${i}">${i+1}</button>`).join("");$("palette").querySelectorAll(".p").forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()})}
function choose(L){
 if(submitted)return;
 const q=QUESTIONS[idx];if(answers[q.id])return;
 answers[q.id]=L; const ok=L===q.answer; beep(ok);fireworks(ok);render();
}
function startExam(){
 candidate=$("candidate").value.trim();if(!candidate){$("candidate").focus();return}
 idx=0;answers={};submitted=false;startAt=Date.now();
 $("start").classList.add("hidden");$("result").classList.add("hidden");$("admin").classList.add("hidden");$("exam").classList.remove("hidden");
 render();timerHandle=setInterval(tick,250);tick();
}
function tick(){
 const used=Math.floor((Date.now()-startAt)/1000), left=DURATION-used;$("timer").textContent=formatTime(left);
 $("timer").classList.toggle("warn",left<=300);
 if(left<=0)submitExam();
}
function submitExam(){
 if(submitted)return;submitted=true;clearInterval(timerHandle);
 const used=Math.min(DURATION,Math.floor((Date.now()-startAt)/1000));
 let correct=0,attempted=0;QUESTIONS.forEach(q=>{if(answers[q.id]){attempted++;if(answers[q.id]===q.answer)correct++}});
 const wrong=attempted-correct,unanswered=QUESTIONS.length-attempted;
 const result={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),candidate,score:correct,percentage:(correct/QUESTIONS.length*100),correct,incorrect:wrong,attempted,unanswered,timeUsed:used,completedAt:new Date().toISOString(),answers};
 const arr=getResults();arr.push(result);saveResults(arr);
 showResult(result);
 submitToCentralScoreboard(result);
}
function showResult(r){
  $("exam").classList.add("hidden");$("result").classList.remove("hidden");
  const rows=QUESTIONS.map(q=>{const a=r.answers[q.id],ok=a===q.answer;return `<div class="review-row"><div class="review-q">Q${String(q.id).padStart(2,"0")}. ${esc(q.text)}</div><div class="review-a">Your Answer: <b>${a?esc(a+". "+q.options[a.charCodeAt(0)-65]):"Unanswered"}</b> · Correct Answer: <b>${q.answer}. ${esc(q.options[q.answer.charCodeAt(0)-65])}</b> <span class="tag ${!a?"skip":ok?"ok":"bad"}">${!a?"UNANSWERED":ok?"CORRECT":"WRONG"}</span></div></div>`}).join("");

  const resultOMR=QUESTIONS.map(q=>{
    const a=r.answers[q.id]||"";
    const cells=["A","B","C","D"].map(L=>{
      const cls=(a===L?"candidate ":"")+(q.answer===L?"official":"");
      return `<span class="rb ${cls.trim()}">${L}</span>`;
    }).join("");
    const status=a===q.answer && a ? `<span class="status ok">✓</span>` :
      a ? `<span class="status bad">✕</span>` : `<span class="status skip">—</span>`;
    return `<div class="result-omr-row"><span class="rq">Q${q.id}</span>${cells}<span class="status" style="color:var(--green);font-size:10px;font-weight:900">KEY<br>${q.answer}</span>${status}</div>`;
  }).join("");

  $("result").innerHTML=`<div class="result-card">
   <h1 class="result-title">MOCK TEST RESULT</h1><div class="candidate">${esc(r.candidate)}</div>
   <div class="stats">
    <div class="stat"><small>Score</small><strong>${r.score}</strong></div>
    <div class="stat"><small>Percentage</small><strong>${r.percentage.toFixed(2)}%</strong></div>
    <div class="stat"><small>Time Used</small><strong>${formatTime(r.timeUsed)}</strong></div>
    <div class="stat"><small>Attempted</small><strong>${r.attempted}</strong></div>
    <div class="stat"><small>Correct</small><strong>${r.correct}</strong></div>
    <div class="stat"><small>Incorrect</small><strong>${r.incorrect}</strong></div>
    <div class="stat"><small>Unanswered</small><strong>${r.unanswered}</strong></div>
    <div class="stat"><small>Total Questions</small><strong>${QUESTIONS.length}</strong></div>
   </div>
   <div class="result-omr-compare">
    <div class="omr-sheet">
     <h3>ANSWER OMR — CANDIDATE vs OFFICIAL ANSWER</h3>
     <div class="result-omr-review">${resultOMR}</div>
     <div class="omr-legend2">Dark bubble = Candidate answer · Green ring = Official answer · ✓ = Correct · <span style="color:var(--red);font-weight:900">✕</span> = Wrong · — = Unanswered</div>
    </div>
   </div>
   <div id="centralStatus" style="margin-top:14px;text-align:center;font-size:12px;font-weight:900;color:var(--green)">CENTRAL SCOREBOARD: SENDING RESULT…</div>
   <div class="result-actions"><button onclick="window.print()">PRINT / SAVE PDF</button><button onclick="location.reload()">BACK TO START</button><button onclick="adminLogin()">ADMIN PORTAL</button></div>
   <div class="review"><h3>ANSWER REVIEW</h3>${rows}</div>
  </div>`;
}

 const wrap=$("adminTable");
 if(!rs.length){wrap.innerHTML='<div class="empty">No saved candidate results.</div>';return}
 wrap.innerHTML=`<div class="tablewrap"><table class="tbl"><thead><tr><th>Candidate Name</th><th>Score</th><th>Time Used</th><th>Exam Date</th><th>Exam Time</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Accuracy</th><th>Rank</th></tr></thead><tbody>${rs.map((r,i)=>{const d=new Date(r.completedAt);return `<tr><td>${esc(r.candidate)}</td><td>${r.score}</td><td>${formatTime(r.timeUsed)}</td><td>${d.toLocaleDateString()}</td><td>${d.toLocaleTimeString()}</td><td>${r.correct}</td><td>${r.incorrect}</td><td>${r.unanswered}</td><td>${r.percentage.toFixed(2)}%</td><td>${i+1}</td></tr>`}).join("")}</tbody></table></div>`;
}
function csv(){
 const rs=getResults().slice().sort((a,b)=>b.score-a.score||a.timeUsed-b.timeUsed);const head=["Rank","Candidate Name","Score","Percentage","Time Used","Exam Date","Exam Time","Correct","Wrong","Unattempted"];
 const lines=[head,...rs.map(r=>{const d=new Date(r.completedAt);const rank=rs.findIndex(x=>x.score===r.score)+1;return [rank,r.candidate,r.score,r.percentage.toFixed(2)+"%",formatTime(r.timeUsed),d.toLocaleDateString(),d.toLocaleTimeString(),r.correct,r.incorrect,r.unanswered]})];
 const txt="\uFEFF"+lines.map(row=>row.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\r\n");
 const blob=new Blob([txt],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ctet_mock_results.csv";a.click();URL.revokeObjectURL(a.href);
}
function toggleTheme(){
  document.body.classList.toggle("light");
  const light=document.body.classList.contains("light");
  localStorage.setItem("ctet_theme",light?"light":"dark");
  $("themeBtn").textContent=light?"🌙 DARK":"☀️ THEME";
}
function loadTheme(){
  const light=localStorage.getItem("ctet_theme")==="light";
  document.body.classList.toggle("light",light);
  if($("themeBtn"))$("themeBtn").textContent=light?"🌙 DARK":"☀️ THEME";
}
$("themeBtn").onclick=toggleTheme;
$("adminTopBtn").onclick=adminLogin;
loadTheme();

$("startBtn").onclick=startExam;
$("candidate").addEventListener("keydown",e=>{if(e.key==="Enter")startExam()});
$("refreshAdmin").onclick=renderAdmin;
$("csvAdmin").onclick=csv;
$("printAdmin").onclick=()=>window.print();
$("clearAdmin").onclick=()=>{if(confirm("Are you sure you want to delete all candidate results?")){localStorage.removeItem(RESULTS_KEY);renderAdmin()}};
window.adminLogin=adminLogin;
</script>
</body>
