const $=id=>document.getElementById(id),scr=$("screen"),clock=$("clock"),live=$("live"),fx=$("fx");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function start(){clock.textContent="60:00";live.textContent="0";scr.innerHTML='<section class="card start"><div class="startin"><h1>MOCK TEST</h1><label>Candidate Name</label><input id="name" class="name" maxlength="80" autocomplete="name"><button id="go" class="startbtn" disabled>EXAM START</button></div></section>';let n=$("name"),b=$("go");n.oninput=()=>b.disabled=!n.value.trim();b.onclick=()=>{S={name:n.value.trim(),i:0,a:Array(Q.length).fill(null),c:0,w:0,t:Date.now(),done:false};audio();render();T=setInterval(tick,1000);tick()}}
function audio(){try{A=A||new(window.AudioContext||window.webkitAudioContext)();if(A.state==="suspended")A.resume()}catch(e){}}
function tone(f,d,type,t,g){if(!A)return;let o=A.createOscillator(),v=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(A.destination);o.start(t);o.stop(t+d+.02)}
function ok(){audio();if(!A)return;let t=A.currentTime;tone(660,.16,"sine",t,1);tone(880,.18,"sine",t+.13,1);tone(1320,.24,"sine",t+.27,1)}
function no(){audio();if(!A)return;let t=A.currentTime;tone(190,.2,"square",t,1);tone(135,.24,"square",t+.16,1);tone(95,.3,"sawtooth",t+.34,1)}
function boom(good){let col=good?"#00ff66":"#ff1744",c=document.createElement("div");c.style.cssText=`position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:${col};box-shadow:0 0 40px 20px ${good?"rgba(0,255,102,.8)":"rgba(255,23,68,.8)"}`;fx.appendChild(c);for(let i=0;i<100;i++){let p=document.createElement("i"),a=Math.random()*Math.PI*2,d=130+Math.random()*310;p.style.cssText=`position:absolute;left:50%;top:50%;width:${2+Math.random()*3}px;height:${10+Math.random()*25}px;border-radius:50%;background:${col};box-shadow:0 0 12px ${col};transform:translate(-50%,-50%) rotate(${Math.random()*360}deg)`;p.animate([{transform:p.style.transform+" translate(0,0)",opacity:1},{transform:p.style.transform+` translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:.1}],{duration:900+Math.random()*450,fill:"forwards",easing:"cubic-bezier(.1,.7,.2,1)"});fx.appendChild(p)}setTimeout(()=>{c.remove();fx.querySelectorAll("i").forEach(x=>x.remove())},1550)}
function tick(){if(!S||S.done)return;let left=Math.max(0,3600-Math.floor((Date.now()-S.t)/1000));clock.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(!left)finish()}
function render(){let q=Q[S.i];scr.innerHTML=`<section class="card exam"><div class="qh"><div class="qn">Q${q.id}.</div><div class="prog">${q.id} / ${Q.length}</div></div><div class="question">${esc(q.q)}</div><div class="opts" id="opts"></div><button class="next" id="next" disabled>${S.i===Q.length-1?"SUBMIT EXAM":"NEXT"}</button></section>`;q.options.forEach((x,i)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="let">${"ABCD"[i]}</span><span>${esc(x)}</span>`;b.onclick=()=>answer(i);$("opts").appendChild(b)})}
function answer(i){if(S.a[S.i]!==null)return;let q=Q[S.i];S.a[S.i]=i;if(i===q.answer){S.c++;ok();boom(true)}else{S.w++;no();boom(false)}live.textContent=S.c;document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add("good");if(j===i&&i!==q.answer)b.classList.add("bad");if(j===i)b.classList.add("sel")});$("next").disabled=false}
document.addEventListener("click",e=>{if(e.target.id==="next"&&S.a[S.i]!==null){if(S.i===Q.length-1)finish();else{S.i++;render()}}});
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
async function finish(){if(!S||S.done)return;S.done=true;clearInterval(T);let used=Math.min(3600,Math.floor((Date.now()-S.t)/1000)),att=S.a.filter(x=>x!==null).length,r={candidateName:S.name,totalQuestions:Q.length,attempted:att,correct:S.c,incorrect:S.w,unanswered:Q.length-att,score:S.c,percentage:Number((S.c/Q.length*100).toFixed(2)),timeUsed:fmt(used),completedDateTime:new Date().toISOString(),answers:S.a};let a=JSON.parse(localStorage.getItem("ctet_mock_results")||"[]");a.unshift(r);localStorage.setItem("ctet_mock_results",JSON.stringify(a));if(URL)try{await fetch(URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(r)})}catch(e){}result(r)}
function result(r){scr.innerHTML=`<section class="card result"><div class="title">FINAL RESULT</div><div class="stats">${[['Candidate Name',r.candidateName],['Total Questions',r.totalQuestions],['Attempted',r.attempted],['Correct',r.correct],['Incorrect',r.incorrect],['Unanswered',r.unanswered],['Score',r.score],['Percentage',r.percentage+"%"],['Time Used',r.timeUsed]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join("")}</div><div class="actions"><button class="act" id="review">ANSWER REVIEW</button><button class="act" id="new">NEW TEST</button></div><div id="rv"></div></section>`;$("review").onclick=()=>review(r);$("new").onclick=start}
function review(r){$("rv").innerHTML='<div class="review">'+Q.map((q,i)=>{let a=r.answers[i],s=a===null?"Unanswered":a===q.answer?"Correct":"Wrong";return `<div class="ri"><div class="rq">Q${q.id}. ${esc(q.q)}</div><div class="ans">Candidate's Answer: ${a===null?"—":esc(q.options[a])}<br>Correct Answer: ${esc(q.options[q.answer])}<br><strong class="${s==="Correct"?"goodtxt":s==="Wrong"?"badtxt":""}">${s}</strong></div></div>`}).join("")+'</div>'}
function arr(){return JSON.parse(localStorage.getItem("ctet_mock_results")||"[]")}

function load(){let a=arr();rows.innerHTML=a.length?a.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.candidateName)}</td><td>${r.score}</td><td>${r.percentage}%</td><td>${r.correct}</td><td>${r.incorrect}</td><td>${r.attempted}</td><td>${r.unanswered}</td><td>${esc(r.timeUsed)}</td><td>${new Date(r.completedDateTime).toLocaleString()}</td></tr>`).join(""):'<tr><td colspan="10" style="text-align:center">No saved results.</td></tr>'}
