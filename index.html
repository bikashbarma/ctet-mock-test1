<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>CTET Mock Test 2026 — Paper I — Set 4 | Central Scoreboard</title>
<style>
:root{--bg:#000;--panel:#090909;--panel2:#111;--line:#292929;--text:#fff;--muted:#aaa;--green:#18e76b;--red:#ff3152;--gold:#ffd45a;--blue:#5f8cff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
body.light{--bg:#f4f6fa;--panel:#fff;--panel2:#f1f3f7;--line:#d8dce5;--text:#111;--muted:#626a78;--gold:#8b5d00;--blue:#315fce}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.topbar{position:fixed;left:0;right:0;top:0;height:68px;z-index:50;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.light .topbar{background:rgba(255,255,255,.95)}
.leftbox{justify-self:start}
.rightbox{justify-self:end;display:flex;align-items:center;gap:8px}
.centerbox{justify-self:center;text-align:center;min-width:100px}
.themeBtn,.adminBtn,.correctBtn{border:1px solid #444;border-radius:11px;padding:9px 12px;background:#111;color:#fff;font-weight:1000;letter-spacing:.03em}
body.light .themeBtn,body.light .adminBtn,body.light .correctBtn{background:#fff;color:#111;border-color:#c4c9d3}
.adminBtn{background:var(--gold);color:#000;border-color:var(--gold)}
.correctBtn{display:block;margin:auto;background:#0b301b;border-color:#1e9c52;color:#69ff9d;min-width:110px}
.timer{margin-top:3px;font-variant-numeric:tabular-nums;font-size:18px;font-weight:1000;letter-spacing:.04em}
.timer.warn{color:#ffb13b}
.screen{position:fixed;inset:68px 0 0;display:flex;align-items:center;justify-content:center;padding:18px}
.startCard{width:min(560px,92vw);background:linear-gradient(180deg,#101010,#070707);border:1px solid #2a2a2a;border-radius:24px;padding:30px;box-shadow:0 25px 90px rgba(0,0,0,.65)}
body.light .startCard{background:#fff;border-color:#d8dce5;box-shadow:0 20px 60px rgba(0,0,0,.10)}
.brand{margin:0;text-align:center;font-size:clamp(30px,6vw,46px);font-weight:1000;letter-spacing:.10em}
label{display:block;margin:28px 0 9px;font-weight:1000;font-size:18px}
.name{width:100%;height:56px;border:1px solid #3a3a3a;border-radius:14px;background:#050505;color:#fff;padding:0 16px;outline:none;font-weight:800;font-size:18px}
body.light .name{background:#f8f9fc;color:#111;border-color:#cfd4de}
.name:focus{border-color:var(--blue)}
.startBtn{width:100%;height:58px;margin-top:12px;border:0;border-radius:14px;background:#fff;color:#000;font-weight:1000;font-size:18px;letter-spacing:.04em}
.exam{position:fixed;inset:68px 0 0;height:calc(100dvh - 68px);padding:10px 12px}
.examInner{height:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column;min-height:0}
.progress{height:28px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900;padding:0 3px}
.qcard{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.2vh,22px);display:flex;flex-direction:column;box-shadow:0 18px 70px rgba(0,0,0,.35)}
.qnum{color:var(--gold);font-weight:1000;font-size:15px;margin-bottom:7px}
.question{font-size:clamp(16px,2.3vh,21px);line-height:1.38;font-weight:800;max-width:1000px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:clamp(12px,2vh,18px)}
.opt{min-height:54px;border:1px solid #333;border-radius:13px;background:var(--panel2);color:var(--text);padding:11px 13px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-weight:750;line-height:1.28;font-size:clamp(14px,1.9vh,17px);transition:.12s}
.opt:active{transform:scale(.995)}
.opt.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.opt.correct{background:#0a321a;border-color:var(--green);color:#c9ffdc}
.opt.wrong{background:#3a0811;border-color:var(--red);color:#ffd1d8}
.letter{font-weight:1000;min-width:24px}
.feedback{min-height:26px;margin-top:7px;font-size:13px;font-weight:1000}
.feedback.ok{color:var(--green)} .feedback.bad{color:var(--red)}
.actions{margin-top:auto;padding-top:9px;display:flex;justify-content:flex-end}
.next{width:min(240px,100%);height:54px;border:0;border-radius:14px;background:#fff;color:#000;font-weight:1000;font-size:18px}
.next:disabled{opacity:.35;cursor:not-allowed}
.result,.admin{position:fixed;inset:68px 0 0;overflow:auto;padding:18px}
.resultCard,.adminCard{width:min(1150px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.resultTitle{text-align:center;font-weight:1000;letter-spacing:.08em;margin:0}
.candidate{text-align:center;color:var(--muted);font-weight:800;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}
.stat{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:13px}
.stat small{display:block;color:var(--muted);font-weight:800}
.stat strong{display:block;font-size:22px;margin-top:4px;font-weight:1000}
.review{margin-top:20px;display:grid;gap:9px}
.reviewRow{border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--panel2)}
.reviewQ{font-weight:900;line-height:1.35}
.reviewA{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.4}
.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:1000;margin-left:5px}
.ok{background:#123e23;color:#70ff9f} .bad{background:#470b17;color:#ff91a4} .skip{background:#303030;color:#bbb}
.resultActions,.adminTools{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.resultActions button,.adminTools button{border:1px solid #444;border-radius:11px;padding:11px 13px;background:#111;color:#fff;font-weight:900}
body.light .resultActions button,body.light .adminTools button{background:#fff;color:#111;border-color:#c4c9d3}
.danger{border-color:#9d253b!important;color:#ff91a4!important}
.adminHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adminTitle{margin:0;font-weight:1000}
.tableWrap{overflow:auto;margin-top:16px}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-size:12px}
.empty{padding:30px;text-align:center;color:var(--muted);font-weight:800}
.status{margin-top:10px;text-align:center;font-size:12px;font-weight:1000}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1000}
@media(max-width:700px){
 .topbar{height:62px;padding:7px 8px}
 .screen,.exam,.result,.admin{inset:62px 0 0}
 .exam{height:calc(100dvh - 62px);padding:7px 8px}
 .themeBtn,.adminBtn,.correctBtn{font-size:10px;padding:8px 8px;border-radius:9px}
 .correctBtn{min-width:90px}
 .timer{font-size:16px}
 .startCard{padding:23px}
 .options{grid-template-columns:1fr;gap:7px}
 .opt{min-height:49px;padding:9px 11px}
 .qcard{border-radius:16px;padding:13px}
 .progress{height:24px;font-size:11px}
 .next{height:52px;width:100%}
 .stats{grid-template-columns:repeat(2,1fr)}
 .result,.admin{padding:10px}
}
@media(max-height:620px) and (orientation:landscape){
 .question{font-size:15px;line-height:1.25}
 .opt{min-height:42px;font-size:13px;padding:7px 9px}
 .options{gap:6px;margin-top:7px}
 .qcard{padding:10px}
 .next{height:45px}
}
@media print{
 html,body{overflow:visible;background:#fff!important;color:#000!important}
 .topbar,.resultActions,.adminTools,#fx{display:none!important}
 .result,.admin{position:static;overflow:visible;padding:0}
 .resultCard,.adminCard{border:0;box-shadow:none}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<header class="topbar">
  <div class="leftbox"><button id="themeBtn" class="themeBtn" type="button">☀ THEME</button></div>
  <div class="centerbox">
    <button id="correctBtn" class="correctBtn" type="button">CORRECT: 0</button>
    <div id="timer" class="timer">60:00</div>
  </div>
  <div class="rightbox"><button id="adminBtn" class="adminBtn" type="button">ADMIN PORTAL</button></div>
</header>

<section id="start" class="screen">
  <div class="startCard">
    <h1 class="brand">MOCK TEST</h1>
    <label for="candidate">Candidate Name</label>
    <input id="candidate" class="name" autocomplete="name" spellcheck="false">
    <button id="startBtn" class="startBtn" type="button">EXAM START</button>
  </div>
</section>

<section id="exam" class="exam hidden">
  <div class="examInner">
    <div class="progress"><span id="progress"></span><span id="sectionLabel"></span></div>
    <div id="qcard" class="qcard"></div>
  </div>
</section>

<section id="result" class="result hidden"></section>

<section id="admin" class="admin hidden">
  <div class="adminCard">
    <div class="adminHead">
      <div><h2 class="adminTitle">ADMIN DASHBOARD</h2></div>
      <div class="adminTools">
        <button id="refreshAdmin">REFRESH RESULTS</button>
        <button id="csvAdmin">DOWNLOAD RESULTS CSV</button>
        <button id="printAdmin">PRINT / SAVE PDF REPORT</button>
        <button id="clearAdmin" class="danger">CLEAR ALL RESULTS</button>
      </div>
    </div>
    <div id="adminTable"></div>
  </div>
</section>

<script>
const QUESTIONS=[{"orig":1,"text":"A delay in a child's language development is often found to also affect the child's social interactions with peers. This best illustrates which characteristic of development?","options":["Development is holistic; all domains are interconnected","Development is identical in every child","Development stops after adolescence","Development is unrelated to any domain interaction"],"id":1,"answer":"A"},{"orig":2,"text":"Two children of the same age reach the same developmental milestones at different times, even though the overall pattern of development is the same for both. This illustrates:","options":["Individual differences in the rate/pace of development","A developmental disorder in one of the children","Growth, not development","Predictable pattern only, with no individual variation"],"id":2,"answer":"A"},{"orig":3,"text":"A child who already has a schema for \"dog\" encounters a cat for the first time and creates an entirely new schema for it. According to Piaget, this process is called:","options":["Equilibration only","Object permanence","Assimilation","Accommodation"],"id":3,"answer":"D"},{"orig":4,"text":"A teacher notices that a student cannot yet solve a two-step word problem alone but can solve it successfully with a few guiding questions from the teacher. This gap is best described using Vygotsky's concept of:","options":["Object permanence","Equilibration","The Zone of Proximal Development","Conservation"],"id":4,"answer":"C"},{"orig":5,"text":"A person argues that an unjust law should be changed because it violates a broader principle of human dignity, even though the law is not yet officially amended. According to Kohlberg, this reflects:","options":["Stage 1: Obedience and Punishment","Stage 3: Good Interpersonal Relationships","Stage 5: Social Contract and Individual Rights","Stage 4: Maintaining Social Order only"],"id":5,"answer":"C"},{"orig":6,"text":"According to Erikson, an elderly person who looks back on their life with a sense of satisfaction and acceptance has successfully resolved the crisis of:","options":["Integrity vs Despair","Intimacy vs Isolation","Industry vs Inferiority","Generativity vs Stagnation"],"id":6,"answer":"A"},{"orig":7,"text":"J. P. Guilford's Structure of Intellect model is best known in CTET syllabi for introducing which important distinction?","options":["Assimilation vs accommodation","Formative vs summative assessment","Growth vs development","Convergent thinking vs divergent thinking"],"id":7,"answer":"D"},{"orig":8,"text":"A student who has an unusually strong vocabulary and expresses ideas with exceptional clarity in both speech and writing shows particular strength in which of Gardner's intelligences?","options":["Naturalistic","Logical-Mathematical","Linguistic","Spatial"],"id":8,"answer":"C"},{"orig":9,"text":"A test designed to predict how well a student is likely to learn a new skill, such as music, with training is best described as a test of:","options":["Achievement","Aptitude","Personality","Temperament"],"id":9,"answer":"B"},{"orig":10,"text":"A student has high aptitude for mathematics but shows very little interest in mathematics-related activities, preferring art instead. This illustrates the distinction between:","options":["Personality and temperament","Intelligence and IQ","Growth and development","Aptitude and interest"],"id":10,"answer":"D"},{"orig":11,"text":"The Big Five personality traits are commonly remembered using the acronym OCEAN, which includes Openness, Conscientiousness, Extraversion, Agreeableness, and:","options":["Narcissism","Nurturance","Neuroticism","Naturalism"],"id":11,"answer":"C"},{"orig":12,"text":"According to Thomas and Chess, a child with a generally positive mood, regular routines, and who adapts easily to new situations is classified as a(n):","options":["Gifted child","Difficult child","Easy child","Slow-to-warm-up child"],"id":12,"answer":"C"},{"orig":13,"text":"A student who learns best through diagrams, charts, and written material, rather than through listening or hands-on activity, has a preference for which learning style?","options":["Auditory","Visual","Kinesthetic","Convergent"],"id":13,"answer":"B"},{"orig":14,"text":"A student shows persistent difficulty sustaining attention, is easily distracted, and frequently acts impulsively, beyond what is typical for their age. This profile is most consistent with characteristics associated with:","options":["Attention-Deficit/Hyperactivity Disorder (ADHD)","Dyscalculia","Selective mutism","Autism Spectrum Disorder"],"id":14,"answer":"A"},{"orig":15,"text":"A student shows differences in social communication, strongly prefers a fixed daily routine, and becomes distressed by sudden changes. This profile is most consistent with characteristics associated with:","options":["Dysgraphia","Aphasia","ADHD","Autism Spectrum Disorder"],"id":15,"answer":"D"},{"orig":16,"text":"The removal of physical, attitudinal, curricular, and communication obstacles that prevent children with disabilities from fully participating in education is called:","options":["Remedial teaching only","Special education","Barrier-free education","Segregated education"],"id":16,"answer":"C"},{"orig":17,"text":"Assessment in which a student actively monitors and reflects on their own learning progress is called:","options":["Assessment for learning","Assessment of learning","Assessment as learning","Diagnostic assessment only"],"id":17,"answer":"C"},{"orig":18,"text":"A scoring guide that defines specific criteria and descriptive performance levels for evaluating a piece of student work is called a:","options":["Rubric","Anecdotal record","Portfolio","Checklist"],"id":18,"answer":"A"},{"orig":19,"text":"Which of the following tools measures the DEGREE or FREQUENCY of a student behaviour, rather than simply its presence or absence?","options":["Anecdotal record only","A single test score","Checklist","Rating scale"],"id":19,"answer":"D"},{"orig":20,"text":"Reinforcing a desired behaviour every single time it occurs is called:","options":["Extinction","Partial reinforcement","Continuous reinforcement","Negative punishment"],"id":20,"answer":"C"},{"orig":21,"text":"A student who has learned to ride a bicycle finds it easier to later learn how to ride a scooter. This illustrates:","options":["Negative transfer of learning","Positive transfer of learning","Zero transfer of learning","Retroactive interference"],"id":21,"answer":"B"},{"orig":22,"text":"A student who is used to driving on one side of the road finds it initially difficult to adapt to driving on the opposite side in another country. This illustrates:","options":["Negative transfer of learning","Zero transfer of learning","Proactive interference only","Positive transfer of learning"],"id":22,"answer":"A"},{"orig":23,"text":"According to Maslow's hierarchy, which of the following needs must generally be satisfied FIRST, before higher-level needs like self-actualisation can be fully pursued?","options":["Love and belonging needs","Aesthetic needs","Esteem needs","Physiological needs"],"id":23,"answer":"D"},{"orig":24,"text":"Which of the following is generally considered a characteristic of an effective teacher?","options":["Treating all students identically regardless of individual differences","Rigid adherence to a single teaching method regardless of learner needs","Warmth combined with high, consistent expectations for all students","Avoiding any reflection on one's own teaching practice"],"id":24,"answer":"C"},{"orig":25,"text":"A teacher's facial expressions, tone of voice, and body language, which can reinforce or contradict the spoken message, are examples of:","options":["Written communication","Non-verbal communication","Formal assessment","A rubric"],"id":25,"answer":"B"},{"orig":26,"text":"NCF's approach to school education emphasises moving away from rote learning towards:","options":["Constructivist, activity-based, meaningful learning","Only textbook-based lecture","Elimination of all assessment","Only standardised testing"],"id":26,"answer":"A"},{"orig":27,"text":"The growing capacity to manage and appropriately express the intensity of one's feelings is called:","options":["Emotional intelligence testing","Attachment","Emotional expression only","Emotional regulation"],"id":27,"answer":"D"},{"orig":28,"text":"A child combines two words to convey a simple message, such as \"mummy go,\" during early language development. This is characteristic of the:","options":["Formal grammar stage","One-word (holophrastic) stage","Two-word (telegraphic) stage","Babbling stage"],"id":28,"answer":"C"},{"orig":29,"text":"Which of the following is considered a modern agent of socialisation, alongside family, school, community, and peer group?","options":["Genetics","Media","Maturation","Reflex actions"],"id":29,"answer":"B"},{"orig":30,"text":"A teacher appropriately limits discussion of a student's personal disclosure to only those professionals with a legitimate need to know, rather than sharing it widely. This reflects the professional ethics principle of:","options":["Confidentiality","Non-discrimination","Reflective practice","Fairness"],"id":30,"answer":"A"},{"orig":46,"text":"Speaking is best classified as which type of language skill?","options":["Receptive and written","Productive and oral","Receptive and oral","Productive and written"],"id":31,"answer":"B"},{"orig":47,"text":"According to Krashen's Input Hypothesis, language acquisition occurs most effectively through:","options":["Comprehensible input slightly beyond the learner's current level (i+1)","Repeated punishment for errors","Avoiding all listening practice","Explicit grammar instruction alone"],"id":32,"answer":"A"},{"orig":48,"text":"The ability to connect sentences and ideas coherently to produce a unified spoken or written text is called:","options":["Strategic competence","Sociolinguistic competence","Grammatical competence","Discourse competence"],"id":33,"answer":"D"},{"orig":49,"text":"A teacher explains the rule for forming comparative adjectives first, then has students complete practice exercises applying the rule. This reflects the:","options":["Whole language approach","Inductive approach","Deductive approach","Communicative approach only"],"id":34,"answer":"C"},{"orig":50,"text":"A reading approach that begins with meaning and context, using prediction and prior knowledge to make sense of a text, is called the:","options":["Phonics/Bottom-up approach","Whole Language/Top-down approach","Grammar-Translation approach","Confirmation approach"],"id":35,"answer":"B"},{"orig":51,"text":"The stage of the writing process in which a student corrects grammar, spelling, and punctuation in a near-final draft is called:","options":["Revising","Editing","Pre-writing","Drafting"],"id":36,"answer":"B"},{"orig":52,"text":"Knowledge of vocabulary, sentence structure, and pronunciation rules is called:","options":["Strategic competence","Discourse competence","Sociolinguistic competence","Grammatical competence"],"id":37,"answer":"D"},{"orig":53,"text":"A reading approach that begins with decoding individual letters and sounds, building up to whole-word recognition, is called the:","options":["Process approach","Whole Language approach","Phonics/Bottom-up approach","Communicative approach"],"id":38,"answer":"C"},{"orig":54,"text":"A Hindi-speaking learner of English says \"She is having two brothers,\" reflecting a structure common in the learner's home language. This is an example of a(n):","options":["Intralingual error","Interlingual error","Random mistake","Fair test"],"id":39,"answer":"B"},{"orig":55,"text":"A learner says \"I have two mouses\" instead of \"I have two mice,\" applying the regular plural rule to an irregular word. This is an example of a(n):","options":["Intralingual error (overgeneralisation)","Random mistake","Aphasia","Interlingual error"],"id":40,"answer":"A"},{"orig":56,"text":"When teaching poetry, reading the poem ALOUD with appropriate rhythm and expression is considered:","options":["Only useful for very advanced learners","Irrelevant to comprehension","Unnecessary and old-fashioned","Essential, since rhythm and sound are central to a poem's meaning and effect"],"id":41,"answer":"D"},{"orig":57,"text":"Real objects used as teaching materials to make language concrete for young learners are called:","options":["Operational definitions","Realia","Rubrics","Portfolios"],"id":42,"answer":"B"},{"orig":58,"text":"For a young learner struggling with letter-sound correspondence, an appropriate remedial strategy would be:","options":["Skipping phonics entirely and moving straight to complex texts","Structured, multisensory phonics instruction connecting sounds to letters systematically","Ignoring the difficulty since it will resolve on its own","Only silent reading with no explicit instruction"],"id":43,"answer":"B"},{"orig":59,"text":"The Communicative Approach to language teaching primarily prioritises:","options":["Meaningful, genuine communication and fluency","Rote memorisation of isolated vocabulary lists","Silent, individual written drills only","Grammatical perfection over meaning"],"id":44,"answer":"A"},{"orig":60,"text":"A teacher uses a rubric addressing content, organisation, grammar, and vocabulary to assess a student's short story. This reflects:","options":["A purely oral assessment method","An approach unrelated to writing quality","Assessment based only on grammatical accuracy","A comprehensive, multi-criterion approach to assessing writing"],"id":45,"answer":"D"},{"orig":61,"text":"The place value of 6 in the number 26,485 is:","options":["6","60","600","6,000"],"id":46,"answer":"D"},{"orig":62,"text":"What is the sum of 14,562 and 8,379?","options":["22,941","23,941","21,941","22,841"],"id":47,"answer":"A"},{"orig":63,"text":"What is the difference between 15,000 and 8,647?","options":["7,353","6,343","6,353","6,453"],"id":48,"answer":"C"},{"orig":64,"text":"What is the product of 19 and 16?","options":["324","294","304","314"],"id":49,"answer":"C"},{"orig":65,"text":"Divide 216 by 18. The quotient is:","options":["10","11","12","13"],"id":50,"answer":"C"},{"orig":66,"text":"What is the sum of 1/4 and 1/8?","options":["3/8","1/2","2/8","2/12"],"id":51,"answer":"A"},{"orig":67,"text":"What is 3/4 minus 1/4?","options":["3/8","1","1/4","1/2"],"id":52,"answer":"D"},{"orig":68,"text":"What is 1/2 expressed as a percentage?","options":["12.5%","25%","50%","75%"],"id":53,"answer":"C"},{"orig":69,"text":"The Highest Common Factor (HCF) of 12 and 18 is:","options":["3","6","9","12"],"id":54,"answer":"B"},{"orig":70,"text":"A triangle with one angle exactly equal to 90° is called a:","options":["Isosceles triangle","Right-angled triangle","Obtuse triangle","Equilateral triangle"],"id":55,"answer":"B"},{"orig":71,"text":"The distance from the centre of a circle to any point on its boundary is called the:","options":["Circumference","Chord","Diameter","Radius"],"id":56,"answer":"D"},{"orig":72,"text":"How many flat faces does a cylinder have?","options":["3","0","1","2"],"id":57,"answer":"D"},{"orig":73,"text":"An angle that measures exactly 180° is called a(n):","options":["Right angle","Obtuse angle","Reflex angle","Straight angle"],"id":58,"answer":"D"},{"orig":74,"text":"1 tonne is equal to how many kilograms?","options":["100","1,000","10,000","10"],"id":59,"answer":"B"},{"orig":75,"text":"1 square metre is equal to how many square centimetres?","options":["10,000","100,000","100","1,000"],"id":60,"answer":"A"},{"orig":76,"text":"A regular (non-leap) year has how many days?","options":["366","360","364","365"],"id":61,"answer":"D"},{"orig":77,"text":"What comes next in the pattern of odd numbers: 1, 3, 5, 7, __?","options":["8","9","10","11"],"id":62,"answer":"B"},{"orig":78,"text":"A line graph is generally most appropriate for showing:","options":["Only a single fixed number with no comparison","Only categorical data with no order","Only three-dimensional shapes","A trend or change in data over time"],"id":63,"answer":"D"},{"orig":79,"text":"The volume of a cube with side 4 cm is:","options":["48 cubic cm","64 cubic cm","12 cubic cm","16 cubic cm"],"id":64,"answer":"B"},{"orig":80,"text":"Which of the following is an even number?","options":["53","27","35","48"],"id":65,"answer":"D"},{"orig":81,"text":"Pólya's FOURTH and final step in problem-solving, after carrying out the plan, is to:","options":["Understand the problem","Devise a plan","Look back and review the solution","Restate the original question only"],"id":66,"answer":"C"},{"orig":82,"text":"The 'Concrete' stage of the CPA (Concrete-Pictorial-Abstract) progression involves:","options":["Only drawings and diagrams","Only numerals and symbolic equations","Verbal explanation with no materials at all","Physical manipulation of real objects"],"id":67,"answer":"D"},{"orig":83,"text":"A teacher presents students with an unfamiliar problem requiring them to combine and adapt several previously separate strategies in a new way. This is best classified as a:","options":["Operational definition","Fair test","Routine problem","Non-routine problem"],"id":68,"answer":"D"},{"orig":84,"text":"A student believes that the fraction 1/8 is larger than 1/4, reasoning simply that 8 is a bigger number than 4. This belief reflects a:","options":["Correct understanding","Careless error","Conceptual error","Procedural error"],"id":69,"answer":"C"},{"orig":85,"text":"A student understands the concept of column subtraction with borrowing but makes a mistake while carrying out one of the borrowing steps. This is best classified as a:","options":["Conceptual error","Procedural error","A correct calculation","An assessment tool"],"id":70,"answer":"B"},{"orig":86,"text":"Geoboards and fraction bars used to help students physically explore geometric and fractional concepts are examples of mathematics:","options":["Teaching aid const DURATION=60*60;

const RESULTS_KEY="ctet_mock_2026_set4_results_v1";
const CENTRAL_SCOREBOARD_URL="https://script.google.com/macros/s/AKfycbyVa34v4bCORe1JUz9_jQFWgAHueqsL1axwgnPOSkeWPeLemIFFkg3EZyV2GJLpnZyuLg/exec";

let candidate="",idx=0,answers={},startAt=0,timerHandle=null,submitted=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const letter=i=>String.fromCharCode(65+i);
const answerIndex=L=>L.charCodeAt(0)-65;

function getResults(){try{return JSON.parse(localStorage.getItem(RESULTS_KEY)||"[]")}catch(e){return[]}}
function saveResults(a){localStorage.setItem(RESULTS_KEY,JSON.stringify(a))}

function submitToCentralScoreboard(r){
  const status=$("centralStatus");
  if(status){status.textContent="CENTRAL SCOREBOARD: SENDING RESULT…";status.style.color="var(--green)";}
  const payload={
    token:CENTRAL_API_TOKEN,testId:TEST_ID,candidateName:String(r.candidate||"").trim(),
    candidate:String(r.candidate||"").trim(),score:Number(r.score)||0,percentage:Number(r.percentage)||0,
    timeUsed:Number(r.timeUsed)||0,correct:Number(r.correct)||0,incorrect:Number(r.incorrect)||0,
    attempted:Number(r.attempted)||0,unanswered:Number(r.unanswered)||0,
    submissionId:String(r.id||""),date:r.completedAt
  };
  const body=JSON.stringify(payload);
  try{
    return fetch(CENTRAL_SCOREBOARD_URL,{
      method:"POST",mode:"no-cors",redirect:"follow",credentials:"omit",
      headers:{"Content-Type":"text/plain;charset=UTF-8"},
      body,keepalive:true
    }).then(()=>{
      if(status){status.textContent="CENTRAL SCOREBOARD: SUBMISSION SENT";status.style.color="var(--green)";}
    }).catch(()=>{
      try{navigator.sendBeacon(CENTRAL_SCOREBOARD_URL,new Blob([body],{type:"text/plain;charset=UTF-8"}));
        if(status){status.textContent="CENTRAL SCOREBOARD: SUBMISSION QUEUED";status.style.color="var(--green)";}
      }catch(e){if(status){status.textContent="CENTRAL SCOREBOARD: CONNECTION FAILED";status.style.color="var(--red)";}}
    });
  }catch(e){
    try{navigator.sendBeacon(CENTRAL_SCOREBOARD_URL,new Blob([body],{type:"text/plain;charset=UTF-8"}));
      if(status){status.textContent="CENTRAL SCOREBOARD: SUBMISSION QUEUED";status.style.color="var(--green)";}
    }catch(err){if(status){status.textContent="CENTRAL SCOREBOARD: CONNECTION FAILED";status.style.color="var(--red)";}}
    return Promise.resolve();
  }
}

let audioCtx=null;
function ensureAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audioCtx)audioCtx=new C();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}

function beep(correct){
  const c=ensureAudio();if(!c)return;
  const now=c.currentTime;
  const tones=correct?[523.25,659.25,783.99,1046.5,1318.51]:[220,174.61,146.83,110,82.41];
  const type=correct?"sine":"square";
  tones.forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    const t=now+i*(correct?.07:.075);
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(1.0,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+(correct?.25:.30));
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(correct?.27:.32));
  });
}

function fireworks(good){
  const canvas=$("fx"),ctx=canvas.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=innerWidth/2,cy=innerHeight*.48;
  const particles=[];
  const count=190;
  for(let i=0;i<count;i++){
    const a=Math.PI*2*i/count+(Math.random()-.5)*.045;
    const ring=i%3;
    const speed=(ring===0?3.4:ring===1?4.8:6.0)+Math.random()*1.8;
    particles.push({
      x:cx,y:cy,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
      life:55+Math.random()*30,size:1.4+Math.random()*2.4,
      delay:Math.random()*5
    });
  }
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    particles.forEach(p=>{
      if(frame<p.delay)return;
      p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.994;p.vy*=.994;p.life--;
      if(p.life>0){
        ctx.globalAlpha=Math.min(1,p.life/22);
        ctx.fillStyle=good?"#18e76b":"#ff3152";
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      }
    });
    ctx.globalAlpha=1;
    if(frame++<92)requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  draw();
}

function formatTime(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}

function sectionFor(q){
  const o=q.orig;
  if(o<=30)return "CHILD DEVELOPMENT & PEDAGOGY";
  if(o<=60)return "LANGUAGE I — ENGLISH";
  if(o<=90)return "MATHEMATICS";
  return "ENVIRONMENTAL STUDIES";
}

function render(){
  const q=QUESTIONS[idx],a=answers[q.id]||"";
  $("progress").textContent=`Question ${idx+1} of ${QUESTIONS.length}`;
  $("sectionLabel").textContent=sectionFor(q);
  const fb=a?(a===q.answer?`✓ CORRECT`:`✕ WRONG — Correct answer: ${q.answer}`):"";
  $("qcard").innerHTML=`
    <div class="qnum">Q${q.id}</div>
    <div class="question">${esc(q.text)}</div>
    <div class="options">${q.options.map((o,i)=>{
      const L=letter(i);
      let cls="opt";
      if(a===L)cls+=" selected";
      if(a){if(q.answer===L)cls+=" correct";else if(a===L)cls+=" wrong"}
      return `<button type="button" class="${cls}" data-opt="${L}" ${a?"disabled":""}>
        <span class="letter">${L}.</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    <div class="feedback ${a?(a===q.answer?"ok":"bad"):""}">${fb}</div>
    <div class="actions"><button id="nextBtn" class="next" type="button" ${a?"":"disabled"}>${idx===QUESTIONS.length-1?"FINISH":"NEXT"}</button></div>`;
  $("qcard").querySelectorAll("[data-opt]").forEach(el=>el.onclick=()=>choose(el.dataset.opt));
  $("nextBtn").onclick=()=>{if(idx<QUESTIONS.length-1){idx++;render()}else submitExam()};
  $("correctBtn").textContent=`CORRECT: ${countCorrectLive()}`;
}

function countCorrectLive(){let n=0;QUESTIONS.forEach(q=>{if(answers[q.id]===q.answer)n++});return n}

function choose(L){
  if(submitted)return;
  const q=QUESTIONS[idx];if(answers[q.id])return;
  answers[q.id]=L;
  const ok=L===q.answer;
  beep(ok);fireworks(ok);
  render();
}

function startExam(){
  const n=$("candidate").value.trim();
  if(!n){$("candidate").focus();return}
  ensureAudio();
  candidate=n;idx=0;answers={};submitted=false;startAt=Date.now();
  $("start").classList.add("hidden");$("result").classList.add("hidden");$("admin").classList.add("hidden");$("exam").classList.remove("hidden");
  render();timerHandle=setInterval(tick,250);tick();
}

function tick(){
  const used=Math.floor((Date.now()-startAt)/1000),left=DURATION-used;
  $("timer").textContent=formatTime(left);$("timer").classList.toggle("warn",left<=300);
  if(left<=0)submitExam();
}

function submitExam(){
  if(submitted)return;submitted=true;clearInterval(timerHandle);
  const used=Math.min(DURATION,Math.floor((Date.now()-startAt)/1000));
  let correct=0,attempted=0;
  QUESTIONS.forEach(q=>{if(answers[q.id]){attempted++;if(answers[q.id]===q.answer)correct++}});
  const incorrect=attempted-correct,unanswered=QUESTIONS.length-attempted;
  const result={
    id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
    candidate,score:correct,percentage:correct/QUESTIONS.length*100,correct,incorrect,attempted,unanswered,
    timeUsed:used,completedAt:new Date().toISOString(),answers:{...answers}
  };
  const arr=getResults();arr.push(result);saveResults(arr);
  showResult(result);submitToCentralScoreboard(result);
}

function showResult(r){
  $("exam").classList.add("hidden");$("result").classList.remove("hidden");
  const rows=QUESTIONS.map(q=>{
    const a=r.answers[q.id]||"",ok=a===q.answer;
    const your=a?`${a}. ${q.options[answerIndex(a)]}`:"Unanswered";
    const correct=`${q.answer}. ${q.options[answerIndex(q.answer)]}`;
    return `<div class="reviewRow"><div class="reviewQ">Q${q.id}. ${esc(q.text)}</div>
      <div class="reviewA">Candidate's Answer: <b>${esc(your)}</b> · Correct Answer: <b>${esc(correct)}</b>
      <span class="tag ${!a?"skip":ok?"ok":"bad"}">${!a?"UNANSWERED":ok?"CORRECT":"WRONG"}</span></div></div>`;
  }).join("");
  $("result").innerHTML=`<div class="resultCard">
    <h1 class="resultTitle">MOCK TEST RESULT</h1>
    <div class="candidate">${esc(r.candidate)}</div>
    <div class="stats">
      <div class="stat"><small>Total Questions</small><strong>${QUESTIONS.length}</strong></div>
      <div class="stat"><small>Attempted</small><strong>${r.attempted}</strong></div>
      <div class="stat"><small>Correct</small><strong>${r.correct}</strong></div>
      <div class="stat"><small>Incorrect</small><strong>${r.incorrect}</strong></div>
      <div class="stat"><small>Unanswered</small><strong>${r.unanswered}</strong></div>
      <div class="stat"><small>Score</small><strong>${r.score}</strong></div>
      <div class="stat"><small>Percentage</small><strong>${r.percentage.toFixed(2)}%</strong></div>
      <div class="stat"><small>Time Used</small><strong>${formatTime(r.timeUsed)}</strong></div>
    </div>
    <div id="centralStatus" class="status">CENTRAL SCOREBOARD: SENDING RESULT…</div>
    <div class="resultActions">
      <button onclick="window.print()">PRINT / SAVE PDF</button>
      <button onclick="location.reload()">BACK TO START</button>
      <button onclick="adminLogin()">ADMIN PORTAL</button>
    </div>
    <div class="review"><h3>ANSWER REVIEW</h3>${rows}</div>
  </div>`;
}

function adminLogin(){
  const p=prompt("Admin Password");
  if(p!==ADMIN_PASSWORD){alert("Incorrect password.");return}
  $("start").classList.add("hidden");$("exam").classList.add("hidden");$("result").classList.add("hidden");$("admin").classList.remove("hidden");
  $("timer").textContent="60:00";$("correctBtn").textContent="CORRECT: 0";renderAdmin();
}

function rankResults(rs){
  return rs.slice().sort((a,b)=>b.score-a.score||a.timeUsed-b.timeUsed||new Date(a.completedAt)-new Date(b.completedAt));
}

function renderAdmin(){
  const rs=rankResults(getResults()),wrap=$("adminTable");
  if(!rs.length){wrap.innerHTML='<div class="empty">No saved candidate results.</div>';return}
  wrap.innerHTML=`<div class="tableWrap"><table><thead><tr>
    <th>Rank</th><th>Candidate Name</th><th>Score</th><th>Percentage</th><th>Correct</th><th>Incorrect</th><th>Attempted</th><th>Unanswered</th><th>Time Used</th><th>Completed Date/Time</th>
  </tr></thead><tbody>${rs.map((r,i)=>{
    const d=new Date(r.completedAt);
    return `<tr><td>${i+1}</td><td>${esc(r.candidate)}</td><td>${r.score}</td><td>${r.percentage.toFixed(2)}%</td><td>${r.correct}</td><td>${r.incorrect}</td><td>${r.attempted}</td><td>${r.unanswered}</td><td>${formatTime(r.timeUsed)}</td><td>${d.toLocaleString()}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

function downloadCSV(){
  const rs=rankResults(getResults());
  const head=["Rank","Candidate Name","Score","Time used","Percentage","Completed Date/Time"];
  const lines=[head,...rs.map((r,i)=>[i+1,r.candidate,r.score,formatTime(r.timeUsed),r.percentage.toFixed(2)+"%",new Date(r.completedAt).toLocaleString()])];
  const txt="\uFEFF"+lines.map(row=>row.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\r\n");
  const blob=new Blob([txt],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="CTET_Set4_Results.csv";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("ctet_mock_theme",document.body.classList.contains("light")?"light":"dark");
  $("themeBtn").textContent=document.body.classList.contains("light")?"☾ DARK":"☀ THEME";
}
function loadTheme(){
  const light=localStorage.getItem("ctet_mock_theme")==="light";
  document.body.classList.toggle("light",light);$("themeBtn").textContent=light?"☾ DARK":"☀ THEME";
}
